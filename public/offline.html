<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem internet · Publike</title>
<meta name="theme-color" content="#fbf7ef">
<style>
  :root { --fundo: #fbf7ef; --texto: #1f1a14; --apagado: #6b6052; --terra: #c2410c; --sobre-terra: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #17130f; --texto: #f5efe6; --apagado: #b5a998; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--fundo); color: var(--texto);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 22rem; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 20px 0 8px; }
  p { color: var(--apagado); margin: 0 0 24px; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--terra);
           color: var(--sobre-terra); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Sem internet agora</h1>
  <p>O Publike precisa da internet para mostrar as vagas e os serviços mais novos. Confira o Wi-Fi ou os dados móveis.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
