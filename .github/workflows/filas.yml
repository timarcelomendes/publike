# A garantia das filas do site: a cada 5 minutos chama /api/filas, que manda os e-mails e roda as revisões
# da IA mesmo sem ninguém usando o site. Se a fila não andar (chave do servidor recusada, configuração
# faltando, e-mail com falha), esta tarefa falha e o GitHub manda um e-mail avisando.
#
# Precisa, em Settings › Secrets and variables › Actions:
#   - segredo PUBLIKE_CRON_SECRET: o mesmo valor de CRON_SECRET na Vercel (Production);
#   - variável PUBLIKE_URL (opcional): o endereço do site, se não for https://publike.org.
# O GitHub pode atrasar tarefas agendadas em alguns minutos nos horários cheios.
name: Filas do site

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: filas-do-site
  cancel-in-progress: false

jobs:
  esvaziar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Esvaziar as filas (e-mails e revisões da IA)
        env:
          SEGREDO: ${{ secrets.PUBLIKE_CRON_SECRET }}
          SITE: ${{ vars.PUBLIKE_URL || 'https://publike.org' }}
        run: |
          if [ -z "$SEGREDO" ]; then
            echo "::error title=Falta o segredo::Crie o segredo PUBLIKE_CRON_SECRET (o mesmo CRON_SECRET da Vercel)."
            exit 1
          fi
          resposta=$(curl -sS --max-time 90 -w '\n%{http_code}' -H "Authorization: Bearer $SEGREDO" "$SITE/api/filas" || true)
          codigo=$(printf '%s' "$resposta" | tail -n1)
          corpo=$(printf '%s' "$resposta" | sed '$d')
          echo "$corpo"
          case "$codigo" in
            200) echo "Filas em dia." ;;
            401) echo "::error title=Segredo recusado::O site recusou o segredo: confira se PUBLIKE_CRON_SECRET é igual ao CRON_SECRET da Vercel."; exit 1 ;;
            3*) echo "::error title=Endereço do site::O site redirecionou ($codigo): ponha o endereço final na variável PUBLIKE_URL."; exit 1 ;;
            *) echo "::error title=Fila do site parada::$corpo"; exit 1 ;;
          esac
